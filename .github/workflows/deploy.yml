name: Deploy CyberChef to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install and build
        run: |
          npm install
          npx grunt prod

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/prod

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
